{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Organization Access Denied - Project Harvey</title>
  <link rel="icon" type="image/png" href="{% static 'core/images/harvey_icon.png' %}">
  {% tailwind_css %}
 
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .hero-pattern {
        background-color: #f8fafc;
        background-image:
            radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0, transparent 50%),
            radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0, transparent 50%),
            radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.05) 0, transparent 50%);
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
    }
  </style>
</head>

<body class="hero-pattern min-h-screen flex items-center justify-center text-slate-900 relative overflow-hidden">

  <!-- Background decorative blobs -->
  <div
    class="absolute top-1/3 left-1/4 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl mix-blend-multiply pointer-events-none">
  </div>
  <div
    class="absolute bottom-1/3 right-1/4 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl mix-blend-multiply pointer-events-none">
  </div>

  <div class="glass-card rounded-3xl p-10 max-w-md text-center relative z-10 w-full mx-4">

    <div class="mb-8">
      <div
        class="w-24 h-24 bg-red-50 rounded-3xl flex items-center justify-center mx-auto border border-red-100 shadow-[0_10px_30px_rgba(239,68,68,0.1)]">
        <i class="fas fa-shield-halved text-4xl text-red-500"></i>
      </div>
    </div>

    <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-4">Access Denied</h2>
    <p class="text-slate-500 mb-10 leading-relaxed font-medium">
      You don’t have permission to access the chatbot interface.<br>
      Please contact your organization administrator to request access.
    </p>

    <form method="POST" action="{% url 'logout' %}" class="block">
      {% csrf_token %}
      <button type="submit"
        class="w-full bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-xl font-bold transition-all shadow-lg shadow-slate-900/10 flex items-center justify-center gap-3 group active:scale-[0.98]">
        <i class="fas fa-sign-out-alt group-hover:-translate-x-1 transition-transform"></i> Return to Login
      </button>
    </form>

    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-10">
      Project Harvey • HR Intelligence
    </p>
  </div>
</body>

</html>
