{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <title>Project Harvey Chat</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hero-pattern {
            background-color: var(--color-harvey-bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.15) 0, transparent 50%),
                radial-gradient(at 50% 0%, rgba(31, 41, 55, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(6, 182, 212, 0.1) 0, transparent 50%);
        }

        .glass-panel {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-bubble-user {
            border-bottom-right-radius: 0 !important;
            background: linear-gradient(135deg, var(--color-harvey-primary) 0%, var(--color-harvey-accent) 100%);
            color: var(--color-harvey-bg);
            font-weight: 500;
        }

        .chat-bubble-ai {
            border-bottom-left-radius: 0 !important;
            background: var(--color-harvey-elevated);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--color-harvey-text);
        }

        /* Custom Scrollbar */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(6, 182, 212, 0.2);
            border-radius: 20px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background-color: rgba(6, 182, 212, 0.4);
        }

        /* Mobile specific bottom spacing for iPhone home bar */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-safe-bottom {
                padding-bottom: env(safe-area-inset-bottom, 20px);
            }
        }
    </style>
</head>

<body class="hero-pattern flex flex-col h-[100dvh] text-white overflow-hidden">

    <!-- Background decorative blobs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-harvey-primary/10 rounded-full blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-harvey-accent/10 rounded-full blur-[100px]">
        </div>
    </div>

    <!-- Header Component -->
    {% include "core/components/header.html" %}

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()"
            class="fixed inset-0 bg-black/50 z-30 hidden md:hidden transition-opacity backdrop-blur-sm"></div>

        <!-- Sidebar -->
        <aside id="chat-sidebar" onclick="handleSidebarClick(event)"
            class="w-64 shrink-0 bg-harvey-bg/95 border-r border-white/5 flex flex-col -translate-x-full md:translate-x-0 transition-all duration-300 absolute md:static top-0 left-0 h-full z-40 backdrop-blur-md md:backdrop-blur-none cursor-pointer group/sidebar">

            <div class="p-4 transition-all duration-200">
                <button onclick="startNewChat()"
                    class="w-full h-12 bg-white/5 hover:bg-white/10 text-harvey-text hover:text-white rounded-xl flex items-center justify-start px-3 gap-3 transition-all border border-white/5 font-medium backdrop-blur-sm group overflow-hidden">
                    <i class="fas fa-plus text-lg min-w-[20px] text-center text-harvey-primary"></i>
                    <span class="whitespace-nowrap transition-opacity duration-200 sidebar-text opacity-100">New
                        Chat</span>
                </button>
            </div>

            <div class="px-6 pb-2 transition-opacity duration-200 sidebar-text">
                <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 whitespace-nowrap">History
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-3 space-y-1 chat-box pb-4" id="conversation-list">
                <!-- Dynamic Items -->
                <div class="animate-pulse flex space-x-4 p-3">
                    <div class="rounded-full bg-white/10 h-2 w-full"></div>
                </div>
            </div>

        </aside>

        <!-- Chat Container -->
        <div class="flex-1 flex flex-col relative w-full min-w-0 bg-transparent h-[100dvh] md:h-auto">
            <!-- Sidebar Toggle (Visible Mobile Only) -->
            <button onclick="toggleSidebar()" data-hamburger
                class="md:hidden absolute top-4 left-4 z-40 text-white/50 hover:text-white p-3 bg-black/40 rounded-lg hover:bg-white/10 transition-all">
                <i class="fas fa-bars text-lg"></i>
            </button>

            {% include "core/components/chat_area.html" %}
            {% include "core/components/footer_input.html" %}
        </div>
    </div>

    <!-- Scripts Component -->
    {% include "core/components/chat_scripts.html" %}

</body>

</html>
