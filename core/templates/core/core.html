{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
    <title>Project Harvey Chat</title>
    {% tailwind_css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .hero-pattern {
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0, transparent 50%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.05) 0, transparent 50%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }

        .chat-bubble-user {
            border-bottom-right-radius: 4px !important;
            background: #1e293b;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .chat-bubble-ai {
            border-bottom-left-radius: 4px !important;
            background: white;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        /* Custom Scrollbar */
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 20px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background-color: #cbd5e1;
        }

        /* Mobile specific bottom spacing for iPhone home bar */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .mobile-safe-bottom {
                padding-bottom: env(safe-area-inset-bottom, 20px);
            }
        }
    </style>
</head>

<body class="hero-pattern flex flex-col h-[100dvh] text-slate-900 overflow-hidden">

    <!-- Background decorative blobs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-500/5 rounded-full blur-[100px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-500/5 rounded-full blur-[100px]">
        </div>
    </div>

    <!-- Header Component -->
    {% include "core/components/header.html" %}

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" onclick="toggleSidebar()"
            class="fixed inset-0 bg-slate-900/20 z-30 hidden md:hidden transition-opacity backdrop-blur-sm"></div>

        <!-- Sidebar -->
        <aside id="chat-sidebar" onclick="handleSidebarClick(event)"
            class="w-68 shrink-0 bg-white/80 border-r border-slate-200 flex flex-col -translate-x-full md:translate-x-0 transition-all duration-300 absolute md:static top-0 left-0 h-full z-40 backdrop-blur-xl cursor-default group/sidebar">

            <div class="p-5">
                <button onclick="startNewChat()"
                    class="w-full h-11 bg-slate-900 hover:bg-slate-800 text-white rounded-xl flex items-center justify-center gap-2 transition-all shadow-md active:scale-95 font-bold">
                    <i class="fas fa-plus text-sm"></i>
                    <span class="sidebar-text">New Chat</span>
                </button>
            </div>

            <div class="px-6 pb-2 sidebar-text">
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Recent Chats</div>
            </div>

            <div class="flex-1 overflow-y-auto px-3 space-y-1 chat-box pb-10" id="conversation-list">
                <!-- Dynamic Items -->
                <div class="px-3 py-2 animate-pulse flex flex-col gap-2">
                    <div class="h-8 bg-slate-100 rounded-lg w-full"></div>
                    <div class="h-8 bg-slate-50/50 rounded-lg w-3/4"></div>
                </div>
            </div>

        </aside>

        <!-- Chat Container -->
        <div class="flex-1 flex flex-col relative w-full min-w-0 bg-transparent h-[100dvh] md:h-auto">
            <!-- Sidebar Toggle (Visible Mobile Only) -->
            <button onclick="toggleSidebar()" data-hamburger
                class="md:hidden absolute top-4 left-4 z-40 text-slate-400 hover:text-slate-900 p-2.5 bg-white border border-slate-200 rounded-lg shadow-sm transition-all active:scale-90">
                <i class="fas fa-bars-staggered"></i>
            </button>

            {% include "core/components/chat_area.html" %}
            {% include "core/components/footer_input.html" %}
        </div>
    </div>

    <!-- Scripts Component -->
    {% include "core/components/chat_scripts.html" %}

</body>

</html>
