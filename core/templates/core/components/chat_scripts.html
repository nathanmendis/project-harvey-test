<!-- Chat Application Scripts -->
{% load static %}

<!-- 1. Configuration & Namespace (Inject Server Data) -->
<script src="{% static 'core/js/chat/namespace.js' %}"></script>
<script>
    // Inject Django Template Variables into the global Config
    if (window.Harvey && window.Harvey.Config) {
        Harvey.Config.csrfToken = "{{ csrf_token }}";
        Harvey.Config.username = "{{ user.username|escapejs }}";
        Harvey.Config.urls.chatWs = window.location.protocol === 'https:' ? 'wss' : 'ws';
    } else {
        console.error("Harvey Namespace not loaded!");
    }
</script>

<!-- Markdown Library for Chat Formatting -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    /* Restore basic HTML styles stripped by Tailwind for markdown rendering */
    .prose-chat p {
        margin-bottom: 0.75em;
    }

    .prose-chat p:last-child {
        margin-bottom: 0;
    }

    .prose-chat strong {
        font-weight: 800;
        color: #4f46e5; /* indigo-600 */
    }

    .prose-chat em {
        font-style: italic;
    }

    .prose-chat ul {
        list-style-type: disc;
        padding-left: 1.5em;
        margin-bottom: 0.75em;
    }

    .prose-chat ol {
        list-style-type: decimal;
        padding-left: 1.5em;
        margin-bottom: 0.75em;
    }

    .prose-chat li {
        margin-bottom: 0.25em;
    }

    .prose-chat a {
        color: #4f46e5;
        text-decoration: underline;
        text-underline-offset: 2px;
        font-weight: 700;
    }

    .prose-chat a:hover {
        color: #4338ca;
    }

    .chat-bubble-user.prose-chat a {
        color: white;
    }

    .chat-bubble-user.prose-chat a:hover {
        color: rgba(255, 255, 255, 0.8);
    }

    .prose-chat code {
        background: #f1f5f9;
        color: #475569;
        padding: 0.125rem 0.375rem;
        border-radius: 0.375rem;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.875em;
        border: 1px solid #e2e8f0;
    }

    .prose-chat pre {
        background: #1e293b;
        padding: 1rem;
        border-radius: 0.75rem;
        overflow-x: auto;
        margin-bottom: 1em;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .prose-chat pre code {
        background: transparent;
        padding: 0;
        color: #f8fafc;
        border: none;
        font-size: 0.875rem;
    }

    .chat-bubble-user .prose-chat strong {
        color: white;
    }
</style>

<!-- 2. Modules -->
<script src="{% static 'core/js/chat/utils.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/ui.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/sidebar.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/data.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/socket.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/upload.js' %}?v={% now 'U' %}7"></script>
<script src="{% static 'core/js/chat/main.js' %}?v={% now 'U' %}7"></script>
