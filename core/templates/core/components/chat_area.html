{% load static %}
<!-- Chat Area -->
<main
    class="flex-1 min-h-0 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6 space-y-6 flex flex-col chat-box relative z-10 scroll-smooth"
    id="chat-box">
    <div class="flex flex-col items-center justify-center h-full opacity-80 transition-opacity duration-500"
        id="welcome-placeholder">
        <img src="{% static 'core/images/harvey_icon.png' %}" alt="Harvey" 
            class="w-24 h-24 rounded-[32px] mb-6 shadow-xl shadow-indigo-100 object-contain">
        <h3 class="text-2xl font-black text-slate-900 mb-2">
            Hello, {{ user.username }}</h3>
        <div class="text-center text-slate-500 max-w-sm text-sm font-medium leading-relaxed">
            {% if proactive_greeting %}
                {{ proactive_greeting }}
            {% else %}
                How can I assist you with your HR tasks or policy questions today?
            {% endif %}
        </div>
    </div>
</main>
