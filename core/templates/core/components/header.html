{% load static %}
<!-- Header -->
<header
    class="glass-panel z-20 flex justify-between items-center py-2.5 sm:py-3 px-4 sm:px-6 relative shadow-sm border-b border-slate-200">
    <div class="flex items-center gap-2 sm:gap-3">
        <img src="{% static 'core/images/harvey_icon.png' %}" alt="Harvey" 
            class="h-9 w-9 sm:h-10 sm:w-10 rounded-xl shadow-sm object-contain">
        <div>
            <div class="text-sm sm:text-base font-black text-slate-900 tracking-tight leading-none">Harvey</div>
            <div
                class="text-[9px] sm:text-[10px] text-slate-400 font-bold tracking-widest uppercase hidden sm:block mt-0.5">
                AI HR Assistant</div>
        </div>
    </div>
    <div class="relative" id="user-menu-container">
        <button id="user-menu-btn"
            class="flex items-center gap-2.5 hover:bg-slate-100 py-1.5 px-2 rounded-xl transition-all border border-transparent hover:border-slate-200 focus:outline-none">
            <div
                class="w-8 h-8 md:w-7 md:h-7 rounded-full bg-slate-900 flex items-center justify-center text-xs font-bold text-white shadow-md">
                {{ user.username|make_list|first|upper }}
            </div>
            <span class="text-xs text-slate-600 hidden md:block font-bold">{{ user.username }}</span>
            <i class="fas fa-chevron-down text-[10px] text-slate-400 ml-0.5 transition-transform duration-200"
                id="menu-arrow"></i>
        </button>

        <!-- Dropdown Menu -->
        <div id="user-dropdown"
            class="absolute right-0 top-full mt-2 w-48 bg-white border border-slate-200 rounded-2xl shadow-2xl py-2 hidden opacity-0 transform scale-95 transition-all duration-200 origin-top-right z-50">

            {% if user.is_superuser or user.role in "org_admin,hr,manager" %}
            <a href="{% url 'admin_dashboard' %}"
                class="flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
                <i class="fas fa-chart-pie w-4 text-indigo-500"></i>
                Dashboard
            </a>
            <div class="h-px bg-slate-100 my-1 mx-2"></div>
            {% endif %}

            <form method="POST" action="{% url 'logout' %}" class="block">
                {% csrf_token %}
                <button type="submit"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-slate-600 hover:bg-red-50 hover:text-red-600 transition-colors text-left font-bold">
                    <i class="fas fa-sign-out-alt w-4"></i>
                    Logout
                </button>
            </form>
        </div>
    </div>
</header>
