{% load static %}
<!-- Navbar -->
<nav
    class="absolute top-0 w-full z-10 px-4 sm:px-6 py-3 sm:py-4 border-b border-slate-200 bg-white/50 backdrop-blur-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="relative w-10 h-10 flex-shrink-0 flex items-center justify-center">
                <img src="{% static 'core/images/harvey_icon.png' %}" alt="Harvey" 
                    class="w-full h-full object-contain rounded-xl shadow-sm transform hover:scale-105 transition-transform">
            </div>
            <span class="text-2xl font-extrabold text-slate-900 tracking-tight leading-none">Harvey AI</span>
        </div>

        <div class="flex items-center gap-6">
            <a href="{% url 'docs_home' %}" class="hidden sm:flex items-center gap-2 text-sm font-bold text-slate-600 hover:text-slate-900 transition-colors">
                <i class="fas fa-book text-indigo-500"></i> Docs
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'chat_view' %}"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-bold transition-all shadow-lg shadow-indigo-500/30 text-sm">
                Go to App <i class="fas fa-arrow-right ml-2"></i>
            </a>
            {% else %}

            <div class="flex items-center gap-2 sm:gap-3">
                <a href="#team"
                    class="hidden sm:flex hover:bg-slate-100 text-slate-600 hover:text-slate-900 py-2 px-4 sm:py-2.5 sm:px-6 rounded-xl font-medium transition-all items-center gap-2 border border-slate-200 shadow-sm text-sm whitespace-nowrap bg-white">
                    <i class="fas fa-users text-indigo-500"></i> Contact Team
                </a>
                <a href="{% url 'login' %}"
                    class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl font-bold transition-all shadow-lg text-xs sm:text-sm flex items-center gap-2 whitespace-nowrap">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</nav>
