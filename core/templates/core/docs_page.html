{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Harvey Documentation</title>
  <link rel="icon" type="image/png" href="{% static 'core/images/harvey_icon.png' %}">
  
  <!-- TailwindCSS -->
  {% tailwind_css %}

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #334155;
    }
    
    /* Document Content Styling (Simplistic Light Theme) */
    .prose-docs h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2rem;
      margin-bottom: 1rem;
      border-b: 1px solid #e2e8f0;
      padding-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .prose-docs h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }
    .prose-docs h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .prose-docs p {
      margin-bottom: 1rem;
      line-height: 1.625;
      color: #475569;
    }
    .prose-docs ul, .prose-docs ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    .prose-docs ul {
      list-style-type: disc;
    }
    .prose-docs ol {
      list-style-type: decimal;
    }
    .prose-docs li {
      margin-bottom: 0.35rem;
      color: #475569;
    }
    .prose-docs strong {
      font-weight: 700;
      color: #0f172a;
    }
    .prose-docs code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 0.15em 0.35em;
      border-radius: 4px;
      color: #0f172a;
    }
    .prose-docs pre {
      background-color: #0f172a;
      padding: 1.25rem;
      border-radius: 12px;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }
    .prose-docs pre code {
      background-color: transparent;
      border: none;
      padding: 0;
      font-size: 0.9em;
      color: #f8fafc;
    }
    .prose-docs table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }
    .prose-docs th {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      font-weight: 700;
      padding: 0.65rem 0.85rem;
      text-align: left;
    }
    .prose-docs td {
      border: 1px solid #e2e8f0;
      padding: 0.65rem 0.85rem;
      color: #475569;
    }
    .prose-docs tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .prose-docs blockquote {
      border-left: 4px solid #6366f1;
      background-color: #f5f3ff;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border-radius: 0 8px 8px 0;
    }
    .prose-docs hr {
      border-color: #e2e8f0;
      margin: 1.75rem 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="{% static 'core/images/harvey_icon.png' %}" alt="Harvey" class="w-8 h-8 object-contain">
        <div>
          <h1 class="text-sm font-bold text-slate-900 tracking-tight">Project Harvey Documentation</h1>
          <p class="text-[10px] text-slate-400 font-medium">Public Engineering & Feature Specifications</p>
        </div>
      </div>
      <a href="{% url 'landing_page' %}" class="flex items-center gap-2 px-3 py-1.5 border border-slate-200 hover:bg-slate-50 rounded-lg text-xs font-semibold text-slate-600 transition-all">
        <i class="fas fa-arrow-left text-[10px]"></i> Back to Home
      </a>
    </div>
  </header>

  <!-- Container -->
  <div class="max-w-7xl mx-auto w-full px-6 py-8 flex-1 grid grid-cols-1 lg:grid-cols-4 gap-8">
    
    <!-- Sidebar Navigation -->
    <aside class="lg:col-span-1 flex flex-col gap-1.5 self-start">
      <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-2 mb-2">Documentation Tree</span>
      <nav class="flex flex-col gap-1">
        {% for item in sidebar_items %}
          <a href="{% url 'docs_page' item.key %}" 
             class="flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-all
                    {% if active_key == item.key %}
                      bg-indigo-50 text-indigo-700 border-l-2 border-indigo-600 font-bold
                    {% else %}
                      text-slate-500 hover:text-slate-900 hover:bg-slate-100/60
                    {% endif %}">
            <span>{{ item.label }}</span>
            <i class="fas fa-chevron-right text-[8px] opacity-40"></i>
          </a>
        {% endfor %}
      </nav>
    </aside>

    <!-- Document Content Area -->
    <main class="lg:col-span-3 bg-white border border-slate-200 rounded-2xl p-8 lg:p-10 shadow-sm min-h-[70vh]">
      <div class="border-b border-slate-100 pb-5 mb-6">
        <span class="text-[9px] font-bold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-2 py-0.5 rounded">Active Page</span>
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight mt-2">{{ doc_title }}</h2>
      </div>

      <!-- Rendered Document -->
      <article id="docs-content" class="prose-docs text-slate-700">
        <!-- Markdown HTML will inject here -->
      </article>
    </main>

  </div>

  <!-- Raw Markdown Source -->
  <script id="markdown-source" type="text/markdown">{{ markdown_content|safe }}</script>

  <!-- Marked.js for Client-side Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Mermaid.js for Rendering Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const source = document.getElementById("markdown-source").textContent;
      marked.setOptions({
        headerIds: true,
        mangle: false,
        gfm: true,
        breaks: true
      });
      
      // Render Markdown
      document.getElementById("docs-content").innerHTML = marked.parse(source);
      
      // Intercept and Convert Mermaid Blocks
      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
      if (mermaidBlocks.length > 0) {
        mermaidBlocks.forEach((codeEl) => {
          const preEl = codeEl.parentElement;
          const div = document.createElement('div');
          div.className = 'mermaid my-6';
          div.textContent = codeEl.textContent;
          preEl.parentNode.replaceChild(div, preEl);
        });
        
        // Initialize & Run Mermaid
        mermaid.initialize({ 
          startOnLoad: false, 
          theme: 'neutral',
          securityLevel: 'loose'
        });
        mermaid.run();
      }
    });
  </script>
</body>
</html>
