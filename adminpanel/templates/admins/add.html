{% extends 'admin_base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4">
  <div class="bg-white rounded-[40px] p-12 border border-slate-100 shadow-xl relative overflow-hidden">
    <!-- Decorative Glow -->
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-indigo-50/50 rounded-full blur-3xl opacity-50"></div>

    <div class="relative z-10">
      <div class="flex items-center gap-5 mb-10">
          <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 border border-indigo-100 shadow-sm">
            <i class="fas fa-user-shield text-2xl"></i>
          </div>
          <div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tight">Add Administrator</h1>
            <p class="text-indigo-600 text-[10px] font-black uppercase tracking-[0.2em] mt-2">Organization: <span class="bg-indigo-50 px-2 py-0.5 rounded text-indigo-700 tracking-normal">{{ org.name }}</span></p>
          </div>
      </div>

      {% if messages %}
      <div class="space-y-4 mb-10">
        {% for message in messages %}
        <div
          class="bg-rose-50 border border-rose-100 px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest text-rose-600 flex items-center gap-4 animate-in fade-in slide-in-from-top-2 duration-300">
          <i class="fas fa-exclamation-triangle text-[12px]"></i>
          <span class="normal-case font-bold text-sm">{{ message }}</span>
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
        {% csrf_token %}

        <div class="space-y-3">
          <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Full Name</label>
          <input type="text" name="name" placeholder="John Doe"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold"
            required>
        </div>

        <div class="space-y-3">
          <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Username</label>
          <input type="text" name="username" placeholder="admin.user"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold uppercase tracking-widest"
            required>
        </div>

        <div class="space-y-3">
          <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Email Address</label>
          <input type="email" name="email" placeholder="admin@{{ org.name|lower|cut:' ' }}.com"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold"
            required>
        </div>

        <div class="space-y-3">
          <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Password</label>
          <input type="password" name="password" placeholder="••••••••"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-black tracking-[0.3em]"
            required>
        </div>

        <div class="flex flex-col-reverse md:flex-row items-center justify-between md:col-span-2 mt-12 pt-10 border-t border-slate-50 gap-6">
          <a href="{% url 'manage_org_admins' %}"
            class="text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase tracking-widest transition-colors flex items-center gap-3">
            <i class="fas fa-arrow-left text-[8px]"></i> 
            <span>Cancel</span>
          </a>
          <button type="submit"
            class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-12 py-5 rounded-2xl shadow-2xl shadow-indigo-100 font-black text-[10px] uppercase tracking-[0.2em] transition-all hover:scale-[1.02] active:scale-[0.98]">
            Create Administrator
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
