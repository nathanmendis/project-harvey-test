{% extends 'admin_base.html' %}

{% block title %}Add Policy | {{ org.name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4">
    <div class="bg-white rounded-[40px] p-12 border border-slate-100 shadow-xl relative overflow-hidden">
        <!-- Decorative Glow -->
        <div class="absolute -top-32 -right-32 w-80 h-80 bg-indigo-50/50 rounded-full blur-3xl opacity-50"></div>

        <div class="relative z-10">
            <div class="flex items-center gap-5 mb-10">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 border border-indigo-100 shadow-sm">
                    <i class="fas fa-brain text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-4xl font-black text-slate-900 tracking-tight">Add New Policy</h1>
                    <p class="text-indigo-600 text-[10px] font-black uppercase tracking-[0.2em] mt-2">Add to <span class="bg-indigo-50 px-2 py-0.5 rounded text-indigo-700 tracking-normal">{{ org.name }}</span> Knowledge Base</p>
                </div>
            </div>

            {% if messages %}
            <div class="space-y-4 mb-10">
                {% for message in messages %}
                <div
                    class="bg-rose-50 border border-rose-100 px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest text-rose-600 flex items-center gap-4 animate-in fade-in slide-in-from-top-2 duration-300">
                    <i class="fas fa-exclamation-triangle text-[12px]"></i>
                    <span class="normal-case font-bold text-sm">{{ message }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="space-y-8 relative z-10">
                {% csrf_token %}

                <div class="space-y-3">
                    <label for="title" class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Policy Title</label>
                    <input type="text" name="title" id="title" required placeholder="Employee Handbook"
                        class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold">
                </div>

                <div class="space-y-3">
                    <label for="description"
                        class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Description</label>
                    <textarea name="description" id="description" rows="4"
                        placeholder="Provide a brief overview of this policy..."
                        class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all resize-none font-bold"></textarea>
                </div>

                <div class="space-y-3">
                    <label for="source_type"
                        class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Source Type</label>
                    <select name="source_type" id="source_type" onchange="toggleSourceFields()"
                        class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all appearance-none cursor-pointer font-bold">
                        <option value="upload">Upload Document (PDF, DOCX, TXT)</option>
                        <option value="url">External URL</option>
                    </select>
                </div>

                <div id="file-field" class="space-y-3 bg-slate-50 p-6 rounded-[24px] border border-slate-100">
                    <label for="uploaded_file"
                        class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-3">Upload File</label>
                    <div class="relative">
                        <input type="file" name="uploaded_file" id="uploaded_file"
                            class="block w-full text-xs text-slate-400 file:mr-6 file:py-3 file:px-8 file:rounded-xl file:border-0 file:text-[10px] file:font-black file:uppercase file:tracking-widest file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 file:cursor-pointer transition-all file:shadow-xl file:shadow-indigo-100">
                    </div>
                </div>

                <div id="url-field" class="hidden space-y-3">
                    <label for="external_url"
                        class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">Target Resource URL</label>
                    <input type="url" name="external_url" id="external_url"
                        placeholder="https://portal.company.com/policy-pdf"
                        class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4.5 text-slate-900 placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold">
                </div>

                <div class="flex flex-col-reverse md:flex-row items-center justify-between mt-12 pt-10 border-t border-slate-50 gap-6">
                    <a href="{% url 'manage_policies' %}"
                        class="text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase tracking-widest transition-colors flex items-center gap-3">
                        <i class="fas fa-times text-[8px]"></i>
                        <span>Cancel</span>
                    </a>
                    <button type="submit"
                        class="w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white px-12 py-5 rounded-2xl shadow-2xl shadow-slate-100 font-black text-[10px] uppercase tracking-[0.2em] transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-3">
                        <i class="fas fa-save text-[12px]"></i> 
                        <span>Save Policy</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function toggleSourceFields() {
        const sourceType = document.getElementById('source_type').value;
        const fileField = document.getElementById('file-field');
        const urlField = document.getElementById('url-field');

        if (sourceType === 'upload') {
            fileField.classList.remove('hidden');
            urlField.classList.add('hidden');
            document.getElementById('uploaded_file').required = true;
            document.getElementById('external_url').required = false;
        } else {
            fileField.classList.add('hidden');
            urlField.classList.remove('hidden');
            document.getElementById('uploaded_file').required = false;
            document.getElementById('external_url').required = true;
        }
    }
    // Initialize required state
    toggleSourceFields();
</script>
{% endblock %}
