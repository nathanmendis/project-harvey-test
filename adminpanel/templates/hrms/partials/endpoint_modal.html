{% comment %}Partial: Add Endpoint Modal + JS{% endcomment %}
<div id="add-endpoint-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md animate-in fade-in duration-300">
    <div class="bg-white rounded-[40px] border border-slate-100 w-full max-w-2xl mx-4 p-10 space-y-8 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-50/50 rounded-full blur-3xl opacity-50"></div>
        
        <div class="flex items-center justify-between relative z-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600 border border-indigo-100 shadow-sm">
                    <i class="fas fa-plug text-lg"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-900 tracking-tight">Add API Endpoint</h3>
            </div>
            <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-50 text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-all flex items-center justify-center">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form method="POST" action="{% url 'hrms_integration' %}" class="space-y-6 relative z-10">
            {% csrf_token %}
            <input type="hidden" name="action" value="add_endpoint">

            <!-- Step 1 -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">1. Endpoint URL</label>
                <input type="text" name="endpoint_url" placeholder="/api/v1/employees"
                    class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-slate-900 placeholder-slate-300 font-mono text-sm focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold" />
            </div>

            <!-- Step 2 -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1">2. Target Data Model</label>
                <select id="ep-model" name="target_model" onchange="onModelChange()"
                    class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-slate-900 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold">
                    <option value="">— Select model —</option>
                    {% for val, label in model_choices %}
                    <option value="{{ val }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <div id="schema-hint" class="mt-3 hidden text-[10px] font-black text-slate-400 flex flex-wrap gap-2 items-center"></div>
            </div>

            <!-- Step 3 -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest ml-1 inline-flex items-center gap-2">
                    3. Sample JSON Data
                    <span class="text-slate-400 font-medium normal-case">(Array or Object structure)</span>
                </label>
                <textarea id="ep-json" name="sample_json" rows="5"
                    placeholder='{"name": "John Doe", "email": "john@example.com", ...}'
                    class="w-full bg-slate-50 border border-slate-100 rounded-2xl px-5 py-4 text-slate-900 font-mono text-xs placeholder-slate-300 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-200 focus:outline-none transition-all font-bold"></textarea>
                
                <div id="validation-result" class="mt-4 p-5 rounded-2xl hidden text-[10px] font-black uppercase tracking-widest border"></div>
                
                <button type="button" onclick="validateSample()"
                    class="mt-3 px-5 py-2.5 bg-white hover:bg-slate-50 text-indigo-600 text-[10px] font-black uppercase tracking-widest rounded-xl border border-indigo-100 transition-all flex items-center gap-2">
                    <i class="fas fa-check-double text-[12px]"></i> 
                    <span>Validate Schema</span>
                </button>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-3 pt-6 border-t border-slate-50">
                <button type="button" onclick="closeModal()"
                    class="px-6 py-3 text-slate-400 hover:text-slate-600 text-xs font-black uppercase tracking-widest transition-colors">Cancel</button>
                <button type="submit"
                    class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-xs uppercase tracking-widest transition-all shadow-xl shadow-indigo-100 flex items-center gap-3 active:scale-[0.98]">
                    <i class="fas fa-save text-[10px]"></i> 
                    <span>Add Endpoint</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script id="model-schemas-data" type="application/json">
    {{ model_schemas_json|safe|default:"{}" }}
</script>

<script>
    const MODEL_SCHEMAS = JSON.parse(document.getElementById('model-schemas-data').textContent);
    const CSRF = document.querySelector('[name=csrfmiddlewaretoken]').value;

    function closeModal() {
        const modal = document.getElementById('add-endpoint-modal');
        modal.classList.add('animate-out', 'fade-out');
        setTimeout(() => {
            modal.classList.add('hidden');
            modal.classList.remove('animate-out', 'fade-out');
            const vr = document.getElementById('validation-result');
            if (vr) { vr.classList.add('hidden'); }
            const sh = document.getElementById('schema-hint');
            if (sh) { sh.classList.add('hidden'); }
        }, 200);
    }

    function onModelChange() {
        const model = document.getElementById('ep-model').value;
        const hint = document.getElementById('schema-hint');
        if (!model || !MODEL_SCHEMAS[model]) { hint.classList.add('hidden'); return; }
        const schema = MODEL_SCHEMAS[model];
        const req = schema.required.map(f => `<span class="px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100">${f}*</span>`).join('');
        const opt = (schema.optional || []).map(f => `<span class="px-2 py-0.5 rounded-lg bg-slate-50 text-slate-400 border border-slate-100">${f}</span>`).join('');
        hint.innerHTML = `<span class="text-slate-400 mr-2 uppercase">Required Fields:</span>${req}${opt ? '<span class="text-slate-400 mx-2 uppercase">Optional:</span>' + opt : ''}`;
        hint.classList.remove('hidden');
    }

    async function validateSample() {
        const model = document.getElementById('ep-model').value;
        const json = document.getElementById('ep-json').value;
        const resultEl = document.getElementById('validation-result');
        if (!model) { alert('Please select a target model.'); return; }
        if (!json.trim()) { alert('Sample JSON cannot be empty.'); return; }

        const fd = new FormData();
        fd.append('action', 'validate_endpoint');
        fd.append('target_model', model);
        fd.append('sample_json', json);
        fd.append('csrfmiddlewaretoken', CSRF);

        const res = await fetch(window.location.pathname, { method: 'POST', body: fd });
        const data = await res.json();
        resultEl.classList.remove('hidden');

        if (data.error) {
            resultEl.className = 'mt-4 p-5 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-rose-50 border border-rose-100 text-rose-600 space-y-2';
            resultEl.innerHTML = `<div class="flex items-center gap-2 mb-1"><i class="fas fa-exclamation-triangle"></i> VALIDATION FAILED</div><p class="font-medium normal-case opacity-80">${data.error}</p>`;
        } else if (data.valid) {
            resultEl.className = 'mt-4 p-5 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-emerald-50 border border-emerald-100 text-emerald-600 space-y-2';
            resultEl.innerHTML = `<div class="flex items-center gap-2 mb-1"><i class="fas fa-check-circle"></i> VALID SCHEMA</div>
        <p class="font-medium normal-case opacity-80">Matched Fields: <strong>${data.matched.join(', ')}</strong></p>
        ${data.unknown.length ? '<p class="font-medium normal-case opacity-60">Unknown Fields (Ignored): ' + data.unknown.join(', ') + '</p>' : ''}`;
        } else {
            resultEl.className = 'mt-4 p-5 rounded-2xl text-[10px] font-black uppercase tracking-widest bg-rose-50 border border-rose-100 text-rose-600 space-y-2';
            resultEl.innerHTML = `<div class="flex items-center gap-2 mb-1"><i class="fas fa-times-circle"></i> INVALID SCHEMA</div>
        <p class="font-medium normal-case opacity-80">Missing Fields: <strong>${data.missing.join(', ')}</strong></p>
        ${data.matched.length ? '<p class="font-medium normal-case opacity-60">Resolved Fields: ' + data.matched.join(', ') + '</p>' : ''}`;
        }
    }
</script>
