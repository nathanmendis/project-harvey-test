{% extends 'admin_base.html' %}

{% block content %}
<div class="py-8">
    <div class="mb-10">
        <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-2">Recruitment Dashboard</h1>
        <p class="text-indigo-600 text-[10px] font-black uppercase tracking-[0.3em] bg-indigo-50 inline-block px-3 py-1 rounded-lg">{{ org.name }}</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Candidates Card -->
        <a href="{% url 'candidates' %}"
            class="glass-card rounded-3xl p-8 border-white hover:border-indigo-100 transition-all group shadow-sm hover:shadow-md">
            <div class="flex items-center justify-between mb-6">
                <div
                    class="h-12 w-12 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm">
                    <i class="fas fa-users text-indigo-600 group-hover:text-white text-xl"></i>
                </div>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-1 tracking-tight">Candidates</h3>
            <p class="text-slate-500 text-sm font-medium">Manage applicants</p>
        </a>

        <!-- Jobs Card -->
        <a href="{% url 'jobs' %}"
            class="glass-card rounded-3xl p-8 border-white hover:border-purple-100 transition-all group shadow-sm hover:shadow-md">
            <div class="flex items-center justify-between mb-6">
                <div
                    class="h-12 w-12 bg-purple-50 border border-purple-100 rounded-2xl flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-all shadow-sm">
                    <i class="fas fa-briefcase text-purple-600 group-hover:text-white text-xl"></i>
                </div>
            </div>
            <h3 class="text-2xl font-bold text-slate-900 mb-1 tracking-tight">Job Roles</h3>
            <p class="text-slate-500 text-sm font-medium">Open positions</p>
        </a>

        <!-- Interviews Card -->
        <a href="{% url 'interviews' %}"
            class="glass-card rounded-3xl p-8 border-white hover:border-blue-100 transition-all group shadow-sm hover:shadow-md">
            <div class="flex items-center justify-between mb-6">
                <div
                    class="h-12 w-12 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all shadow-sm">
                    <i class="fas fa-calendar-check text-blue-600 group-hover:text-white text-xl"></i>
                </div>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-1 tracking-tight">Interviews</h3>
            <p class="text-slate-500 text-sm font-medium">Scheduled meetings</p>
        </a>

        <!-- Leaves Card -->
        <a href="{% url 'leaves' %}"
            class="glass-card rounded-3xl p-8 border-white hover:border-amber-100 transition-all group shadow-sm hover:shadow-md">
            <div class="flex items-center justify-between mb-6">
                <div
                    class="h-12 w-12 bg-amber-50 border border-amber-100 rounded-2xl flex items-center justify-center group-hover:bg-amber-600 group-hover:text-white transition-all shadow-sm">
                    <i class="fas fa-umbrella-beach text-amber-600 group-hover:text-white text-xl"></i>
                </div>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-1 tracking-tight">Leaves</h3>
            <p class="text-slate-500 text-sm font-medium">Time off management</p>
        </a>
    </div>
</div>
{% endblock %}
